# Part 3 — The datastore on a StatefulSet.
#
# Apply with:  kubectl apply -f datastore-statefulset-scaffold.yaml
#
# Works on any cluster (minikube, kind, or hosted) with a default StorageClass and the
# postgres:16-alpine / busybox:1.36 Docker Hub images. Two fields are left blank (# TODO).
---
apiVersion: v1
kind: Namespace
metadata:
  name: data-platform-lab
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: data-platform-lab
type: Opaque
stringData:
  POSTGRES_USER: "orders_app"
  POSTGRES_PASSWORD: "s3cr3t-orders-db"
  POSTGRES_DB: "orders"
---
# Governing Service for the StatefulSet (serviceName: postgres).
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: data-platform-lab
  labels:
    app: postgres
spec:
  # --------------------------------------------------------------------------
  # TODO: a StatefulSet needs a HEADLESS governing Service for stable per-pod
  # DNS (postgres-0.postgres.<ns>.svc). Set the right value here.
  # --------------------------------------------------------------------------
  clusterIP: ""
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: data-platform-lab
  labels:
    app: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-credentials
          env:
            # Store data in a subdirectory of the mount (good practice).
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          # Liveness waits well past first-boot initdb so it never races startup.
          livenessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 5
            periodSeconds: 5
          # --------------------------------------------------------------------
          # TODO: add a startupProbe that gates liveness until first-boot initdb
          # is done. A skeleton you can uncomment and complete:
          #
          # startupProbe:
          #   exec:
          #     command: ["pg_isready", "-U", "orders_app", "-h", "127.0.0.1"]
          #   periodSeconds: 5
          #   failureThreshold: 30
          # --------------------------------------------------------------------
          resources:
            limits:
              memory: 256Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        # BUG: no cluster provides a StorageClass called "fast-ssd", so this claim
        # never binds and the pod stays Pending. (Fix portably: use your cluster's
        # default class by removing this field, or a class from `kubectl get storageclass`.)
        storageClassName: fast-ssd
        resources:
          requests:
            storage: 1Gi
---
# Debug box: busybox provides nslookup and nc for DNS/connectivity checks.
apiVersion: v1
kind: Pod
metadata:
  name: db-toolbox
  namespace: data-platform-lab
  labels:
    app: db-toolbox
spec:
  containers:
    - name: busybox
      image: busybox:1.36
      command: ["/bin/sh", "-c", "sleep infinity"]
  restartPolicy: Always
